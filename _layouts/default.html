
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>
    {% if page.title %}
      {{ page.title }} - {{ site.title }}
    {% else %}
      {{ site.title }}
    {% endif %}
  </title>

  <meta name="description" content="{{ page.description | default: site.description }}">

  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/assets/css/markdown_table.css' | relative_url }}">
</head>

<body>

<header class="site-header">
  <div class="container">
    <a href="{{ '/' | relative_url }}" class="site-title">
      {{ site.title }}
    </a>
  </div>
</header>

<main class="container">
  {{ content }}
</main>

<footer class="site-footer">
  <div class="container">
    <a href="{{ '/' | relative_url }}">Home</a>
  </div>
</footer>

<!-- Mermaid diagram support -->
<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  mermaid.initialize({
    startOnLoad: false,
    theme: 'default',
    securityLevel: 'strict'
  });

  // Convert Jekyll's Mermaid code blocks into Mermaid containers.
  document.querySelectorAll(
    'pre > code.language-mermaid, pre > code.lang-mermaid'
  ).forEach((code) => {
    const pre = code.parentElement;
    const diagram = document.createElement('pre');

    diagram.className = 'mermaid';
    diagram.textContent = code.textContent;

    pre.replaceWith(diagram);
  });

  // Render all Mermaid diagrams on the page.
  await mermaid.run({
    querySelector: 'pre.mermaid'
  });
</script>

</body>
</html>
