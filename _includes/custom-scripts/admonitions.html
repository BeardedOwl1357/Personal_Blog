<script>
  document.addEventListener("DOMContentLoaded", () => {
    document.querySelectorAll('blockquote').forEach(blockquote => {
      const firstP = blockquote.querySelector('p');
      if (firstP) {
        const match = firstP.innerHTML.match(/^\s*\[!(NOTE|TIP|IMPORTANT|WARNING|CAUTION)\]/i);
        if (match) {
          const type = match[1].toLowerCase();
          blockquote.classList.add('markdown-alert', `markdown-alert-${type}`);
          firstP.innerHTML = firstP.innerHTML.replace(
            match[0], 
            `<span class="alert-title">${match[1]}</span>`
          );
        }
      }
    });
  });
</script>
